<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoply - Premium E-Commerce Store</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="Shoply - Discover premium lifestyle, electronics, fashion, and home essentials with verified reviews, fast delivery, and wholesale B2B quotes." />
    <meta name="keywords" content="ecommerce, online shopping, electronics, fashion, home essentials, wholesale quotes, b2b marketplace, discounts" />
    <meta name="author" content="Shoply Inc." />
    <meta name="theme-color" content="#f43f5e" />
    <link rel="canonical" href="https://shoply.dev" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shoply - Premium E-Commerce Store" />
    <meta property="og:description" content="Discover premium lifestyle, electronics, fashion, and home essentials with verified reviews and wholesale B2B quotes." />
    <meta property="og:url" content="https://shoply.dev" />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shoply - Premium E-Commerce Store" />
    <meta name="twitter:description" content="Discover premium lifestyle, electronics, fashion, and home essentials with verified reviews and wholesale B2B quotes." />

    <!-- Resource Hints & Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="http://localhost:8082" />
    
    <!-- Non-blocking font load -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
